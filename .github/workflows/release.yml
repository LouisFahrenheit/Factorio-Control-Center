name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # ─── Build Windows archive on a real Windows runner ───────────────────────
  build-windows:
    name: Build Windows archive
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Resolve version
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Windows release archive
        shell: bash
        run: npm run pack:release
        env:
          FCC_BUILD_NUMBER: ${{ github.run_number }}
          FCC_BUILD_ID: ${{ steps.version.outputs.short_sha }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v6
        with:
          name: win-archive
          path: release/factorio-control-center-win.zip
          retention-days: 1

  # ─── Build Linux archive + Docker on Ubuntu ───────────────────────────────
  release:
    name: Build Linux, publish release & Docker
    runs-on: ubuntu-latest
    needs: build-windows

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Resolve version
        id: version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Linux release archive
        run: npm run pack:release
        env:
          FCC_BUILD_NUMBER: ${{ github.run_number }}
          FCC_BUILD_ID: ${{ steps.version.outputs.short_sha }}

      - name: Download Windows archive
        uses: actions/download-artifact@v4
        with:
          name: win-archive
          path: release

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release/factorio-control-center-linux.tar.gz
            release/factorio-control-center-win.zip

      - name: Upload build artifacts (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v6
        with:
          name: factorio-control-center-v${{ steps.version.outputs.version }}
          path: |
            release/factorio-control-center-linux.tar.gz
            release/factorio-control-center-win.zip
          retention-days: 14

      - name: Prepare Docker tags
        id: docker_meta
        shell: bash
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          TAG_NAME="${{ steps.version.outputs.tag }}"
          CLEAN_VER="${TAG_NAME#v}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SAFE_REF=$(echo "${{ github.ref_name }}" | tr '/' '-')
            echo "tags=ghcr.io/$OWNER/factorio-control-center:test,ghcr.io/$OWNER/factorio-control-center:$SAFE_REF" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.version.outputs.is_stable }}" == "true" ]]; then
            echo "tags=ghcr.io/$OWNER/factorio-control-center:latest,ghcr.io/$OWNER/factorio-control-center:$CLEAN_VER" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/$OWNER/factorio-control-center:$CLEAN_VER" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            FCC_BUILD_NUMBER=${{ github.run_number }}
            FCC_BUILD_ID=${{ steps.version.outputs.short_sha }}
          tags: ${{ steps.docker_meta.outputs.tags }}
