name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build, lint, and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Locale sync check
        run: npm run locale:check

      - name: Locale unused keys check
        run: npm run locale:check:unused

      - name: Lint backend
        run: npm run lint:check

      - name: Lint client
        run: npm run client:lint

      - name: Test backend
        run: npm test

      - name: Test client
        run: npm run client:test

      - name: Build
        run: npm run build:all

      - name: Test E2E
        run: npm run test:e2e
